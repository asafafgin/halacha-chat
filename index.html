<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>הלכה בצ׳אט</title>
<style>
:root{--bg:#f4f7f1;--card:#fff;--text:#20251e;--muted:#687166;--border:#dbe2d7;--accent:#36583d;--soft:#eef3ec;--warn:#fbf7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:22px}.brand{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand-main{display:flex;gap:12px;align-items:center}.logo{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:28px}h1{margin:0}.sub,.note{color:var(--muted);font-size:13px}.pill{background:var(--soft);padding:7px 10px;border-radius:999px;font-size:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:16px}textarea{width:100%;min-height:115px;border:1px solid #cad3c7;border-radius:12px;padding:13px;font:inherit;font-size:17px;line-height:1.55}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.group{border:1px solid var(--border);border-radius:14px;padding:13px;background:#fafbf8}.group h3{margin:0 0 9px}.opt{display:flex;gap:8px;margin:9px 0;align-items:center}.opt input{width:18px;height:18px;accent-color:var(--accent)}button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:12px;background:var(--soft);padding:11px;border-radius:10px;line-height:1.55}.warn{margin-top:10px;background:var(--warn);padding:10px;border-radius:10px;font-size:12px;color:#665d50}.result{margin-top:14px;border:1px solid var(--border);border-radius:14px;display:grid;grid-template-columns:1.2fr .8fr;overflow:hidden}.source{padding:16px}.image{padding:16px;background:#fafbf8;border-right:1px solid var(--border);display:grid;place-items:center;text-align:center;color:var(--muted);min-height:220px}.image img{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--border);background:white}.meta{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:9px}.quote{font-size:16px;line-height:1.8}.source-link{display:inline-block;margin-top:10px;color:#315e3b;text-decoration:none;font-size:13px}.empty{padding:18px;text-align:center;color:var(--muted)}.approved{font-size:11px;margin-top:8px;color:var(--muted)}
@media(max-width:700px){.groups,.result{grid-template-columns:1fr}.image{border-right:0;border-top:1px solid var(--border)}}
</style></head>
<body><main class="wrap">
<div class="brand"><div class="brand-main"><div class="logo">📖</div><div><h1>הלכה בצ׳אט</h1><div class="sub">איתור מקורות הלכתיים — לא הכרעה הלכתית</div></div></div><div class="pill" id="netStatus">בודק שרת…</div></div>
<section class="card"><h2>מה השאלה שלך?</h2><textarea id="q">לולב שנפרצו עליו, כשר?</textarea></section>
<section class="card"><h2>בחר רבנים ומקורות</h2><div class="groups">
<div class="group"><h3>ספרדים</h3><label class="opt"><input type="checkbox" name="src" value="Shulchan Arukh" checked>מרן השולחן ערוך</label><label class="opt"><input type="checkbox" name="src" value="Yabia Omer" checked>הרב עובדיה יוסף / יביע אומר</label><label class="opt"><input type="checkbox" name="src" value="Yalkut Yosef" checked>הרב יצחק יוסף / ילקוט יוסף</label></div>
<div class="group"><h3>תימנים</h3><label class="opt"><input type="checkbox" name="src" value="Shulchan Arukh HaMekutzar" checked>הרב יצחק רצאבי / שולחן ערוך המקוצר</label><label class="opt"><input type="checkbox" name="src" value="Arikhat Shulchan" checked>הרב שלמה קורח / עריכת שולחן</label><label class="opt"><input type="checkbox" name="src" value="Vayitzbor Yosef" checked>הרב יוסף צובירי / ויצבור יוסף</label></div>
<div class="group"><h3>אשכנזים</h3><label class="opt"><input type="checkbox" name="src" value="Mishnah Berurah" checked>משנה ברורה</label><label class="opt"><input type="checkbox" name="src" value="Arukh HaShulchan" checked>ערוך השולחן</label><label class="opt"><input type="checkbox" name="src" value="Igrot Moshe" checked>אגרות משה</label></div>
</div><div class="warn">כל המקורות מסומנים כברירת מחדל. התוצאות מוצגות כמקורות לעיון בלבד. אין קביעה הלכתית סופית.</div></section>
<section class="card"><button id="ask">חפש מקורות ברשת</button><div class="status" id="status">מוכן.</div></section>
<section class="card"><h2>מקורות שנמצאו</h2><div id="results" class="note">לא בוצע חיפוש עדיין.</div></section>
</main>
<script src="config.js"></script>
<script>
const qEl=document.getElementById('q'),btn=document.getElementById('ask'),statusEl=document.getElementById('status'),resultsEl=document.getElementById('results'),netStatus=document.getElementById('netStatus');
const API=(window.HALACHA_API_BASE||'').replace(/\/$/,'');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function selectedSources(){return [...document.querySelectorAll('input[name="src"]:checked')].map(x=>x.value)}
async function checkHealth(){if(!API){netStatus.textContent='EC2 טרם חובר';return}try{const r=await fetch(API+'/health');if(!r.ok)throw new Error();netStatus.textContent='● מחובר לשרת EC2'}catch{netStatus.textContent='● אין חיבור לשרת EC2'}}
function render(data){const items=data.results||[],img=data.image||null;if(!items.length){resultsEl.innerHTML='<div class="empty">לא נמצא מקור מתאים בפוסקים שסומנו. אין כאן קביעה הלכתית.</div>';return}resultsEl.innerHTML=items.map((x,i)=>`<div class="result"><div class="source"><div class="meta"><strong>מקור ${i+1}: ${esc(x.heRef||x.ref)}</strong><br>${esc(x.book||x.title||x.path||'')}</div><div class="quote">“${esc(x.text||'נמצא מראה מקום, אך לא התקבל טקסט מלא.') }”</div><a class="source-link" target="_blank" rel="noopener" href="https://www.sefaria.org/${encodeURIComponent(x.ref||'').replace(/%20/g,'_')}">פתח את המקור ב‑Sefaria</a><div class="note">מקור לעיון והשוואה בלבד. האפליקציה אינה מכריעה את ההלכה.</div></div><div class="image">${img&&img.image?`<div><strong>תמונה דומה ממקור תורני מאושר</strong><br><br><img src="${esc(img.image)}" alt="${esc(img.title||'תמונת השוואה')}"><div class="approved">${esc(img.site||'מקור תורני')} • להשוואה בלבד</div><a class="source-link" target="_blank" rel="noopener" href="${esc(img.page||'#')}">פתח את מקור התמונה</a></div>`:'<div><strong>תמונת השוואה</strong><br><br>לא נמצאה כרגע תמונה מאושרת לשאלה זו.</div>'}</div></div>`).join('')}
btn.addEventListener('click',async()=>{const question=qEl.value.trim();if(!question){statusEl.textContent='כתוב שאלה תחילה.';return}if(!API){statusEl.textContent='שרת EC2 עדיין לא חובר לכתובת האתר.';return}btn.disabled=true;btn.textContent='מחפש…';statusEl.textContent='מחפש במקורות דרך שרת EC2…';try{const r=await fetch(API+'/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,sources:selectedSources()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'שגיאת שרת');render(data);statusEl.textContent=`החיפוש הסתיים. נמצאו ${(data.results||[]).length} מקורות.`}catch(e){statusEl.textContent='שגיאת רשת: '+e.message;resultsEl.innerHTML='<div class="empty">לא התקבלה תשובה מהשרת.</div>'}finally{btn.disabled=false;btn.textContent='חפש מקורות ברשת'}});
checkHealth();
</script></body></html>
